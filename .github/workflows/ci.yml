name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Pytest Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-asyncio httpx

      - name: Run Full Pytest Suite (Zero Warnings)
        env:
          ADMIN_API_TOKEN: dev-secret-admin-token-2024
          LLM_FORCE_MOCK: "true"
        run: |
          python -m pytest tests -v -W error::DeprecationWarning

  frontend-build:
    name: Frontend React Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Build Frontend Production Bundle
        env:
          CI: false
          REACT_APP_API_BASE: "http://localhost:8000/api/v1"
        run: |
          npm run build

